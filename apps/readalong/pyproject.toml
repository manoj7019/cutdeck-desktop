[project]
name = "readalong"
version = "1.0.0"
description = "PDF reader that reads aloud with a neural voice and highlights each word and sentence."
requires-python = ">=3.10,<3.14"
dependencies = [
    "pywebview>=5.3",
    "pymupdf>=1.24.10",
    "onnxruntime>=1.18",
    "onnx>=1.16",
    "kokoro-onnx==0.6.1",
    "numpy>=1.26",
]

[tool.uv]
package = false
