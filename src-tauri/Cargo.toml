[package]
name = "cutdeck"
version = "0.1.0"
description = "Cutdeck — desktop video editor"
edition = "2021"
rust-version = "1.85"

[lib]
name = "cutdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
ureq = "2"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
