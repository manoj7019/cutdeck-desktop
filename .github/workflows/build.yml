name: Build installers

# Push a tag like v0.1.0 to publish a draft GitHub Release with installers,
# or run it by hand from the Actions tab to just get the files as artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Fetch FFmpeg and ONNX Runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Fetch FFmpeg and ONNX Runtime (macOS / Linux)
        if: runner.os != 'Windows'
        run: bash scripts/fetch-deps.sh ${{ matrix.target }}

      - name: Rust tests (filtergraph + native cutout)
        if: matrix.target != 'x86_64-apple-darwin'
        working-directory: src-tauri
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ff"
          for f in binaries/cutdeck-ffmpeg-* binaries/cutdeck-ffprobe-*; do
            n=$(basename "$f"); n=${n#cutdeck-}; n=${n%%-*}; ext=""; [[ "$f" == *.exe ]] && ext=".exe"
            cp "$f" "$RUNNER_TEMP/ff/$n$ext"
          done
          CUTDECK_FFMPEG_DIR="$RUNNER_TEMP/ff" cargo test --lib --target ${{ matrix.target }}

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Cutdeck ${{ github.ref_name }}"
          releaseBody: "Download the installer for your system below. Windows: Cutdeck_x64-setup.exe. macOS: the .dmg for Apple silicon (aarch64) or Intel (x64)."
          releaseDraft: true
          args: --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: cutdeck-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
